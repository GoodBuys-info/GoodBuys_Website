name: Fetch Legal News (Monthly)

# Regenerates public/data/legal-news.json: for every company in the registry,
# pulls lawsuit/complaint/settlement/investigation coverage from the approved
# sources (EEOC, OECD Watch, Human Trafficking Search, NPR, Triple Pundit,
# Reuters) plus federal court records via CourtListener, and commits the
# result. Deliberately NOT run on every push like fetch:news — this does
# ~600 targeted search requests plus local LLM inference over the
# freeform-journalism candidates, too slow/wasteful to redo on every deploy.
# The resulting commit lands on main, then this workflow explicitly dispatches
# deploy.yml to ship it — a plain push from this workflow's own commit does
# NOT trigger deploy.yml's `on: push`, since GitHub doesn't cascade workflow
# runs triggered by the default GITHUB_TOKEN (confirmed by testing: the first
# real run committed data with no deploy ever firing for it).
#
# Optional repository secret:
#   COURTLISTENER_API_TOKEN   Free account at courtlistener.com (Profile ->
#                             API Token). Raises the CourtListener rate limit
#                             for a full 205-company run; unset still works,
#                             just more conservatively rate-limited.

on:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

# Never let a manual run race a scheduled one.
concurrency:
  group: fetch-legal-news
  cancel-in-progress: false

permissions:
  contents: write
  # Needed to explicitly dispatch deploy.yml below — the default GITHUB_TOKEN
  # used for the commit/push does not cascade into other workflows on its
  # own (GitHub's anti-recursion safeguard), so this workflow's push alone
  # never fires deploy.yml's `on: push` trigger.
  actions: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache local LLM model
        # node-llama-cpp downloads the ~2GB quantized GGUF into .models/ on
        # first use (see scripts/fetch-legal-news/llm.js). Cache it so only
        # the first-ever run pays the download cost.
        uses: actions/cache@v4
        with:
          path: .models
          key: legal-news-llm-model-qwen2.5-3b-instruct-q4_k_m

      - name: Run legal news fetcher
        run: npm run fetch:legal-news
        env:
          NODE_TELEMETRY_DISABLED: "1"
          COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}

      - name: Commit and push if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # git diff only detects changes to files git already tracks — on
          # the very first run public/data/legal-news.json is untracked, so
          # `git diff --quiet` reports "no changes" even though real data
          # just got generated, and the commit/push below is silently
          # skipped. git status --porcelain catches untracked files too.
          if [ -z "$(git status --porcelain -- public/data/legal-news.json)" ]; then
            echo "No changes to public/data/legal-news.json — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add public/data/legal-news.json
          git commit -m "chore(legal-news): monthly refresh of company legal records"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy
        # See the `actions: write` permission comment above for why this
        # explicit dispatch is necessary — confirmed by testing: the first
        # real run committed and pushed real data, but no deploy.yml run
        # ever fired for that commit.
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
